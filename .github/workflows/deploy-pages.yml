name: Deploy Newsletter to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "data/newsletters/**"
      - "data/rankings/**"
      - "data/factsheets/**"
      - ".github/workflows/deploy-pages.yml"
      - "mkdocs.yml"
      - "scripts/prepare_pages.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs & Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pyyaml

      - name: Prepare Docs Structure
        run: |
          python scripts/prepare_pages.py

      - name: Build Static Site
        run: |
          mkdocs build --strict -d site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
