site_name: P2P Kredite Newsletter & Audit-Ranking
site_description: Automatisierter P2P-Lending Wochenrückblick, Plattform-Audit-Rankings
  und Factsheets
site_author: P2P News Pipeline
site_url: https://fxhuhn.github.io/p2p-news/
repo_url: https://github.com/fxhuhn/p2p-news
repo_name: fxhuhn/p2p-news
theme:
  name: material
  language: de
  features:
  - navigation.top
  - navigation.instant
  - navigation.tabs
  - navigation.sections
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Dunkelmodus aktivieren
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Hellmodus aktivieren
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- tables
- attr_list
nav:
- Newsletter:
  - Aktuelle Ausgabe (KW 43/2026): index.md
  - Archiv:
    - KW 43/2026: archiv/newsletter-2026-W43.md
    - KW 42/2026: archiv/newsletter-2026-W42.md
    - KW 41/2026: archiv/newsletter-2026-W41.md
    - KW 40/2026: archiv/newsletter-2026-W40.md
- Audit-Ranking:
  - Aktuelles Ranking (2026-10): rankings/index.md
  - Archiv:
    - Ranking 2026-10: rankings/archiv/audit-ranking-2026-10.md
- Factsheets:
