services:
  p2p-news:
    build:
      context: .
      dockerfile: Dockerfile
    image: p2p-news:latest
    container_name: p2p-news
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    command: ["scheduler.py"]
