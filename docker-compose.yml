services:
  p2p-news:
    build:
      context: .
      dockerfile: Dockerfile
    image: p2p-news:latest
    container_name: p2p-news
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    volumes:
      - ./data:/app/data
    command: ["scheduler.py"]
